name: Release

# Cut a release by pushing a v* tag. Builds the platform matrix, publishes the
# binaries with a SHA256SUMS manifest, and signs everything with Sigstore
# (keyless — the workflow's own OIDC identity is the signer, and the signature
# lands in the public transparency log, so anyone can verify with `cosign
# verify-blob`). No private key to manage.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to cut (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write   # create the release + upload assets
  id-token: write   # Sigstore keyless signing via OIDC

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl, cross-compiled with `cross` — it carries the
          # aarch64 linker/toolchain a bare `cargo build` on an x86 runner lacks.
          - { target: x86_64-unknown-linux-musl,   runner: ubuntu-latest,  ext: "",     cross: true  }
          - { target: aarch64-unknown-linux-musl,  runner: ubuntu-latest,  ext: "",     cross: true  }
          # Both macOS targets build on the Apple Silicon runner — it cross-compiles
          # x86_64 natively via the universal SDK.
          - { target: aarch64-apple-darwin,        runner: macos-latest,   ext: "",     cross: false }
          - { target: x86_64-apple-darwin,         runner: macos-latest,   ext: "",     cross: false }
          - { target: x86_64-pc-windows-msvc,      runner: windows-latest, ext: ".exe", cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install cross (musl targets)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package archive
        shell: bash
        run: |
          mkdir -p dist
          bin="dove${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/$bin" "$bin"
          # An archive holding a single `dove`/`dove.exe` at its root — the shape
          # Homebrew (.tar.gz) and Scoop (.zip) expect, and what gets signed.
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a "dist/dove-${{ matrix.target }}.zip" "$bin" >/dev/null
          else
            tar czf "dist/dove-${{ matrix.target }}.tar.gz" "$bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dove-${{ matrix.target }}
          path: dist/*

  release:
    name: sign + publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout first — it cleans the workspace, so it must run before the
      # artifacts land. We need packaging/render.sh for the brew/scoop step.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: collect binaries + checksums
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          cd dist
          sha256sum dove-* > SHA256SUMS
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: sign artifacts (keyless)
        run: |
          cd dist
          for f in dove-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Render the Homebrew formula + Scoop manifest from this release's checksums
      # and push each to its tap/bucket repo. Needs a PACKAGES_TOKEN secret with
      # contents:write on boomctl/homebrew-tap and boomctl/scoop-bucket; without
      # it the step is a no-op, so the release itself never depends on it.
      - name: publish to Homebrew tap + Scoop bucket
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "::notice::PACKAGES_TOKEN not set — skipping Homebrew/Scoop publish"
            exit 0
          fi
          packaging/render.sh "$VERSION" dist/SHA256SUMS rendered
          git config --global user.name "dove-release"
          git config --global user.email "release@dove.sh"
          publish() {  # <repo> <rendered file> <path within repo>
            local repo="$1" src="$2" dest="$3"
            rm -rf pkgrepo
            git clone --depth 1 \
              "https://x-access-token:${PACKAGES_TOKEN}@github.com/${repo}.git" pkgrepo
            mkdir -p "pkgrepo/$(dirname "$dest")"
            cp "$src" "pkgrepo/$dest"
            ( cd pkgrepo
              if [ -z "$(git status --porcelain)" ]; then
                echo "${repo}: already at dove ${VERSION}"
              else
                git add "$dest"
                git commit -m "dove ${VERSION}"
                git push origin HEAD
                echo "${repo}: published dove ${VERSION}"
              fi )
          }
          publish "boomctl/homebrew-tap" rendered/homebrew/dove.rb "Formula/dove.rb"
          publish "boomctl/scoop-bucket"  rendered/scoop/dove.json  "bucket/dove.json"
