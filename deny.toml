# cargo-deny — supply-chain hygiene, enforced in CI. Run locally with
# `cargo deny check`. https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail the build on any crate with a known security advisory.
version = 2
yanked = "deny"

[licenses]
# Only permissive licenses compatible with Apache-2.0 distribution.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    # The Mozilla CA-certificate bundle (webpki-roots), pulled by ureq for HTTPS.
    # It's permissive data, not code.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# A crypto/sharing tool should keep its tree lean and auditable.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only pull from crates.io — no git or unknown registries without review.
unknown-registry = "deny"
unknown-git = "deny"
