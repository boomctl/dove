[package]
name = "dove-cli"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Send a file out of your own cloud — encrypted, expiring, one command."
repository = "https://github.com/boomctl/dove"
homepage = "https://dove.sh"
readme = "README.md"
keywords = ["file-sharing", "s3", "encryption", "ephemeral", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "dove"
path = "src/main.rs"

[dependencies]
# Everything else routes through dove-core; the CLI only reaches directly for
# arg parsing, error context, randomness (temp names), and zip (directory
# shares).
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dove-core = { path = "../dove-core", version = "0.1.0" }
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
